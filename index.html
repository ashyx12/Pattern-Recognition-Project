<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Heart Disease Prediction</title>

  <style>
    :root {
      --primary: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #d1d5db;
      --text: #111827;
      --muted: #6b7280;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      padding: 40px 16px;
      color: var(--text);
    }

    .card {
      max-width: 760px;
      margin: auto;
      background: var(--card);
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 6px;
      font-size: 26px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px 22px;
    }

    label {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 6px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }

    button {
      margin-top: 28px;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      transition: background 0.2s, transform 0.05s;
    }

    button:hover {
      background: #1e4ed8;
    }

    button:active {
      transform: translateY(1px);
    }

    pre {
      margin-top: 22px;
      background: #0f172a;
      color: #e5e7eb;
      padding: 16px;
      border-radius: 10px;
      font-size: 13px;
      overflow-x: auto;
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 24px;
      }
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Heart Disease Prediction</h2>
  <div class="subtitle">
    Enter patient details to generate prediction input
  </div>

  <div class="grid">

    <div>
      <label>Age (years)</label>
      <input id="age" type="number" min="1">
    </div>

    <div>
      <label>Sex</label>
      <select id="sex">
        <option value="">Select</option>
        <option value="1">Male</option>
        <option value="0">Female</option>
      </select>
    </div>

    <div>
      <label>Chest Pain Type</label>
      <select id="cp">
        <option value="">Select</option>
        <option value="0">Typical Angina</option>
        <option value="1">Atypical Angina</option>
        <option value="2">Non-anginal Pain</option>
        <option value="3">Asymptomatic</option>
      </select>
    </div>

    <div>
      <label>Resting Blood Pressure (mm Hg)</label>
      <input id="trestbps" type="number">
    </div>

    <div>
      <label>Serum Cholesterol (mg/dL)</label>
      <input id="chol" type="number">
    </div>

    <div>
      <label>Fasting Blood Sugar &gt; 120 mg/dL</label>
      <select id="fbs">
        <option value="">Select</option>
        <option value="1">True</option>
        <option value="0">False</option>
      </select>
    </div>

    <div>
      <label>Resting ECG</label>
      <select id="restecg">
        <option value="">Select</option>
        <option value="0">Normal</option>
        <option value="1">ST-T Abnormality</option>
        <option value="2">LV Hypertrophy</option>
      </select>
    </div>

    <div>
      <label>Maximum Heart Rate</label>
      <input id="thalach" type="number">
    </div>

    <div>
      <label>Exercise Induced Angina</label>
      <select id="exang">
        <option value="">Select</option>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>
    </div>

    <div>
      <label>Oldpeak (ST Depression)</label>
      <input id="oldpeak" type="number" step="0.1">
    </div>

    <div>
      <label>Slope</label>
      <select id="slope">
        <option value="">Select</option>
        <option value="0">Upsloping</option>
        <option value="1">Flat</option>
        <option value="2">Downsloping</option>
      </select>
    </div>

    <div>
      <label>Major Vessels (ca)</label>
      <select id="ca">
        <option value="">Select</option>
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </div>

    <div>
      <label>Thalassemia</label>
      <select id="thal">
        <option value="">Select</option>
        <option value="0">Null</option>
        <option value="1">Normal</option>
        <option value="2">Fixed Defect</option>
        <option value="3">Reversible Defect</option>
      </select>
    </div>

  </div>

  <button onclick="predict()">Predict</button>

  <pre id="output"></pre>
</div>

<script>
async function predict() {
  const data = {
    age: Number(age.value),
    sex: Number(sex.value),
    cp: Number(cp.value),
    trestbps: Number(trestbps.value),
    chol: Number(chol.value),
    fbs: Number(fbs.value),
    restecg: Number(restecg.value),
    thalach: Number(thalach.value),
    exang: Number(exang.value),
    oldpeak: Number(oldpeak.value),
    slope: Number(slope.value),
    ca: Number(ca.value),
    thal: Number(thal.value)
  };

  try {
    const res = await fetch(
      "https://dcthq4qigj.execute-api.ap-south-2.amazonaws.com/predict",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      }
    );

    const json = await res.json();
    document.getElementById("output").textContent =
      JSON.stringify(json, null, 2);

  } catch (err) {
    document.getElementById("output").textContent =
      "Error: " + err;
  }
}
</script>

</body>
</html>
