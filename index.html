<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Clinical Risk Prediction</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 40px;
    }
    .card {
      background: white;
      max-width: 600px;
      margin: auto;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
    }
    pre {
      background: #eee;
      padding: 15px;
      margin-top: 20px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Clinical Risk Prediction</h2>

  <label>Age</label>
  <input id="age" type="number">

  <label>Sex (1 = male, 0 = female)</label>
  <input id="sex" type="number">

  <label>Chest Pain (cp)</label>
  <input id="cp" type="number">

  <label>Resting BP</label>
  <input id="trestbps" type="number">

  <label>Cholesterol</label>
  <input id="chol" type="number">

  <label>Fasting Blood Sugar</label>
  <input id="fbs" type="number">

  <label>Rest ECG</label>
  <input id="restecg" type="number">

  <label>Max Heart Rate</label>
  <input id="thalach" type="number">

  <label>Exercise Induced Angina</label>
  <input id="exang" type="number">

  <label>Oldpeak</label>
  <input id="oldpeak" type="number" step="0.1">

  <label>Slope</label>
  <input id="slope" type="number">

  <label>CA</label>
  <input id="ca" type="number">

  <label>Thal</label>
  <input id="thal" type="number">

  <button onclick="predict()">Predict</button>

  <pre id="output"></pre>
</div>

<script>
async function predict() {
  const data = {
    age: Number(age.value),
    sex: Number(sex.value),
    cp: Number(cp.value),
    trestbps: Number(trestbps.value),
    chol: Number(chol.value),
    fbs: Number(fbs.value),
    restecg: Number(restecg.value),
    thalach: Number(thalach.value),
    exang: Number(exang.value),
    oldpeak: Number(oldpeak.value),
    slope: Number(slope.value),
    ca: Number(ca.value),
    thal: Number(thal.value)
  };

  try {
    const res = await fetch(
      "https://dcthq4qigj.execute-api.ap-south-2.amazonaws.com/predict",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      }
    );

    const json = await res.json();
    document.getElementById("output").textContent =
      JSON.stringify(json, null, 2);

  } catch (err) {
    document.getElementById("output").textContent =
      "Error: " + err;
  }
}
</script>

</body>
</html>
